<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acesse o acerto de estoque BASF.">
    <title>Login · Acerto de estoque BASF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <p class="eyebrow">BASF · VTEX</p>
        <h1 id="login-title">Acesso restrito</h1>
        <p class="intro">Digite a senha para acessar o acerto de estoque.</p>

        {% if setup_error %}
        <p class="message error" role="alert">
          O servidor ainda não foi configurado. Defina APP_PASSWORD e SECRET_KEY no ambiente.
        </p>
        {% elif error %}
        <p class="message error" role="alert">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('login') }}" method="post">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            autofocus
            {% if setup_error %}disabled{% endif %}
          >
          <button class="button" type="submit" {% if setup_error %}disabled{% endif %}>
            Entrar
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
